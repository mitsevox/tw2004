name: Build

on:
  push:
  pull_request:

# Builds of main queue up instead of racing: each one appends to the progress history in turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # A *private* build container holding only the game's main.dol (mitsevox/tw2004-build).
    # See docs/infrastructure.md.
    container: ghcr.io/mitsevox/tw2004-build:main

    runs-on: ubuntu-latest
    permissions:
      contents: write     # the progress history commit on pages-history (main pushes only)
      packages: read      # the private build container
    strategy:
      fail-fast: false
      matrix:
        # Add game versions here
        version: [GW4E69]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Normalize file mod times
    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
            --merge --commit-time

    # Copy the original files to the workspace
    - name: Prepare
      run: cp -a /orig .

    # Restore cached files
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build
          .ninja_deps
          .ninja_log
        key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ matrix.version }}-

    # Build the project
    - name: Build
      run: |
        # The container's compiler and binutils packages are older than this project's pinned
        # versions, so configure.py downloads its own, the same as a local build.
        python configure.py --map --version ${{ matrix.version }}
        # The cached build folder keeps old units' objects; wibo's case-blind file lookup then writes
        # a renamed unit into its old-case object (uiobject.c -> uiObject.c broke every build).
        python tools/build/prune_stale.py
        ninja all_source progress build/${{ matrix.version }}/report.json

    # A file marked done in docs/audit.tsv must stay lint-clean (docs/style.md, "The audit")
    - name: Audit table
      run: python tools/quality/audit.py --check

    # Upload map files
    - name: Upload map
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    # Upload progress report
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json

    # ---- The progress history, main pushes only ---------------------------------------------
    # One record of report.json numbers per build of main (tools/dashboard/pages.py), on the
    # data-only branch pages-history; the shared site's timeline is built from it (site-report).
    - name: Progress history
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.version == 'GW4E69'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git fetch origin pages-history; then
          git worktree add --detach pages-history FETCH_HEAD
        else
          git worktree add --detach pages-history HEAD
          git -C pages-history checkout --orphan pages-history-new
          git -C pages-history rm -rfq .
          echo '[]' > pages-history/history.json
        fi
        python tools/dashboard/pages.py append pages-history/history.json \
            build/${{ matrix.version }}/report.json "$GITHUB_SHA" \
            "$(git log -1 --format=%ct "$GITHUB_SHA")" "$(git log -1 --format=%s "$GITHUB_SHA")"
        git -C pages-history add history.json
        git -C pages-history commit -q -m "history: ${GITHUB_SHA::7}"
        git -C pages-history push origin HEAD:refs/heads/pages-history

  # ---- The shared portfolio site (mitsevox.github.io/games/tw2004/), main pushes only ------------
  # Turns the build's report.json and the progress history into the site's report-v1
  # package (tools/dashboard/site_report.py). The site imports it only while its producer policy
  # (config/tw2004-producer.json there) lists this file's git blob: a change to build.yml needs that
  # policy updated too.
  site-report:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download report
      uses: actions/download-artifact@v4
      with:
        name: GW4E69_report
        path: build/GW4E69

    # The site's packager, from a fixed site revision (it reads the public files only)
    - name: Checkout site tools
      uses: actions/checkout@v4
      with:
        repository: mitsevox/mitsevox.github.io
        ref: 83fa7350997affb95e3e585b52d0be0a9718f807
        path: portfolio
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Site report
      run: |
        git fetch origin pages-history
        git show FETCH_HEAD:history.json > pages-history.json
        python3 tools/dashboard/site_report.py build/GW4E69/report.json pages-history.json site-report \
            "$GITHUB_SHA" "$(git rev-parse "$GITHUB_SHA^{tree}")" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$(git rev-parse "$GITHUB_SHA:.github/workflows/build.yml")"

    - name: Package site report
      working-directory: portfolio
      run: |
        uv run --locked python tools/package_report.py --input ../site-report/public-input \
            --metadata ../site-report/metadata.json --policy ../site-report/policy.json \
            --output ../site-report/package

    - name: Upload site report
      uses: actions/upload-artifact@v4
      with:
        name: site-report
        path: site-report/package/*
        if-no-files-found: error
